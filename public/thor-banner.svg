<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="45%" stop-color="#0a1329" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <linearGradient id="uruGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <linearGradient id="cyanLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0" />
      <stop offset="50%" stop-color="#00f0ff" stop-opacity="1" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="intenseGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur1" />
      <feGaussianBlur stdDeviation="4" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes lightningStrike {
        0%, 92%, 100% { opacity: 0; }
        93% { opacity: 1; }
        94% { opacity: 0.2; }
        95% { opacity: 0.9; }
        97% { opacity: 0; }
      }
      @keyframes pulseGlow {
        0%, 100% { filter: drop-shadow(0 0 4px #00f0ff); opacity: 0.85; }
        50% { filter: drop-shadow(0 0 16px #00f0ff); opacity: 1; }
      }
      @keyframes beamSlide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(100%); }
      }
      .strike-fx {
        animation: lightningStrike 4.5s infinite;
      }
      .glow-fx {
        animation: pulseGlow 2.8s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1000" height="300" fill="url(#bgGrad)" />

  <!-- Grid Overlay -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(56, 189, 248, 0.05)" stroke-width="1" />
  </pattern>
  <rect width="1000" height="300" fill="url(#grid)" />

  <!-- Outer Cybernetic Border -->
  <rect x="15" y="15" width="970" height="270" rx="8" fill="none" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1.5" />
  <rect x="20" y="20" width="960" height="260" rx="6" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />

  <!-- Cybernetic Corner Brackets -->
  <path d="M 15 45 L 15 15 L 45 15" fill="none" stroke="#00f0ff" stroke-width="3" />
  <path d="M 985 45 L 985 15 L 955 15" fill="none" stroke="#00f0ff" stroke-width="3" />
  <path d="M 15 255 L 15 285 L 45 285" fill="none" stroke="#00f0ff" stroke-width="3" />
  <path d="M 985 255 L 985 285 L 955 285" fill="none" stroke="#00f0ff" stroke-width="3" />

  <!-- Center Horizontal Energy Line -->
  <line x1="50" y1="150" x2="950" y2="150" stroke="url(#cyanLine)" stroke-width="1.5" />

  <!-- Animated Lightning Bolt Strikes -->
  <g class="strike-fx">
    <path d="M 180 0 L 195 70 L 175 110 L 220 160 L 190 200 L 210 260 L 240 300" fill="none" stroke="#ffffff" stroke-width="3" filter="url(#intenseGlow)" />
    <path d="M 195 70 L 240 95 L 230 135" fill="none" stroke="#00f0ff" stroke-width="1.5" />
    <path d="M 820 0 L 795 80 L 830 140 L 800 200 L 825 300" fill="none" stroke="#38bdf8" stroke-width="2.5" filter="url(#intenseGlow)" />
    <!-- Flash background -->
    <rect width="1000" height="300" fill="rgba(0, 240, 255, 0.12)" />
  </g>

  <!-- Left: Stylized Mjölnir Hammer -->
  <g transform="translate(110, 80)" class="glow-fx">
    <!-- Hammer Head -->
    <rect x="-45" y="0" width="90" height="54" rx="4" fill="url(#uruGrad)" stroke="#38bdf8" stroke-width="2" />
    <line x1="-35" y1="27" x2="35" y2="27" stroke="#00f0ff" stroke-width="2" />
    <circle cx="0" cy="27" r="14" fill="none" stroke="#00f0ff" stroke-width="2" />
    <!-- Handle -->
    <rect x="-6" y="54" width="12" height="65" fill="#451a03" stroke="#94a3b8" stroke-width="1" />
    <line x1="-6" y1="68" x2="6" y2="68" stroke="#cbd5e1" stroke-width="1" />
    <line x1="-6" y1="82" x2="6" y2="82" stroke="#cbd5e1" stroke-width="1" />
    <line x1="-6" y1="96" x2="6" y2="96" stroke="#cbd5e1" stroke-width="1" />
    <!-- Pommel -->
    <circle cx="0" cy="123" r="8" fill="#cbd5e1" />
  </g>

  <!-- Typography Content -->
  <!-- Eyebrow Badge -->
  <g transform="translate(230, 52)">
    <rect x="0" y="0" width="310" height="24" rx="4" fill="rgba(14, 165, 233, 0.12)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1" />
    <text x="12" y="16" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#00f0ff" letter-spacing="2">
      ⚡ ASGARDIAN PROTOCOL // SYS.ONLINE
    </text>
  </g>

  <!-- Main Title: BARATH P -->
  <text x="230" y="112" font-family="'Cinzel', Georgia, serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="3" filter="url(#cyanGlow)">
    BARATH P
  </text>
  <text x="475" y="112" font-family="'Cinzel', Georgia, serif" font-size="28" font-weight="700" fill="#38bdf8" letter-spacing="2">
    ⚡ GOD OF THUNDER &amp; CODE
  </text>

  <!-- Subtitle -->
  <text x="230" y="146" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#cbd5e1" letter-spacing="1.5">
    M.SC DATA SCIENCE SCHOLAR  •  MACHINE LEARNING ARCHITECT  •  AI SYSTEMS
  </text>

  <!-- Badges / Skills Pills -->
  <g transform="translate(230, 175)">
    <g transform="translate(0, 0)">
      <rect width="86" height="24" rx="3" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
      <text x="43" y="16" font-family="monospace" font-size="11" fill="#ffffff" text-anchor="middle">PYTHON</text>
    </g>
    <g transform="translate(94, 0)">
      <rect width="138" height="24" rx="3" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
      <text x="69" y="16" font-family="monospace" font-size="11" fill="#ffffff" text-anchor="middle">MACHINE LEARNING</text>
    </g>
    <g transform="translate(240, 0)">
      <rect width="90" height="24" rx="3" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
      <text x="45" y="16" font-family="monospace" font-size="11" fill="#ffffff" text-anchor="middle">FASTAPI</text>
    </g>
    <g transform="translate(338, 0)">
      <rect width="145" height="24" rx="3" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
      <text x="72.5" y="16" font-family="monospace" font-size="11" fill="#ffffff" text-anchor="middle">AI AGRI-TECH &amp; IOT</text>
    </g>
    <g transform="translate(491, 0)">
      <rect width="65" height="24" rx="3" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
      <text x="32.5" y="16" font-family="monospace" font-size="11" fill="#ffffff" text-anchor="middle">SQL</text>
    </g>
    <g transform="translate(564, 0)">
      <rect width="80" height="24" rx="3" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
      <text x="40" y="16" font-family="monospace" font-size="11" fill="#ffffff" text-anchor="middle">REACT</text>
    </g>
  </g>

  <!-- Coordinates & Status Footer -->
  <text x="230" y="240" font-family="monospace" font-size="11" fill="#64748b" letter-spacing="1">
    LOCATION: COIMBATORE, TN (11.0168° N, 76.9558° E)  //  REPOSITORIES: 07 VERIFIED  //  STATUS: COMBAT READY
  </text>

  <!-- Right Side Runes -->
  <g transform="translate(930, 95)">
    <text x="0" y="0" font-family="serif" font-size="16" fill="rgba(56, 189, 248, 0.65)" text-anchor="middle">ᚦ</text>
    <text x="0" y="24" font-family="serif" font-size="16" fill="rgba(56, 189, 248, 0.65)" text-anchor="middle">ᚢ</text>
    <text x="0" y="48" font-family="serif" font-size="16" fill="rgba(56, 189, 248, 0.65)" text-anchor="middle">ᚱ</text>
    <text x="0" y="72" font-family="serif" font-size="16" fill="rgba(56, 189, 248, 0.65)" text-anchor="middle">ᛁ</text>
    <text x="0" y="96" font-family="serif" font-size="16" fill="rgba(56, 189, 248, 0.65)" text-anchor="middle">ᛋ</text>
  </g>
</svg>
